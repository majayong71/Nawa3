plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.2'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'Nawa3'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	
	implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.19.1'
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.0.10'// MariaDB 의존성 추가
	implementation('org.modelmapper:modelmapper:2.4.2') // ModelMapper 의존성 추가
	developmentOnly("org.springframework.boot:spring-boot-devtools") // html 프리뷰
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation group: 'org.jsoup', name: 'jsoup', version: '1.15.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// JPA 의존성 추가

	// JUnit과 Mockito와 관련된 의존성 testImplementation 추가
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
	testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
	testImplementation 'org.mockito:mockito-core:3.6.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:3.6.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
