plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.2'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'Nawa3'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// Selenium 의존성
	implementation 'org.seleniumhq.selenium:selenium-java:4.21.0'
	implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.21.0'
	// WebDriverManager 의존성
	implementation 'io.github.bonigarcia:webdrivermanager:5.8.0'
	// Apache HttpClient 의존성 ( WebDriverManager 가 필요로 한다 )
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.1'
	implementation 'org.apache.httpcomponents.core5:httpcore5:5.1'


	// MariaDB 의존성 추가
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.0.10'
	implementation('org.modelmapper:modelmapper:2.4.2') // ModelMapper 의존성 추가
	developmentOnly("org.springframework.boot:spring-boot-devtools") // html 프리뷰
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation group: 'org.jsoup', name: 'jsoup', version: '1.15.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// JPA 의존성 추가

	// JUnit과 Mockito와 관련된 의존성 testImplementation 추가
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
	testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
	testImplementation 'org.mockito:mockito-core:3.6.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:3.6.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
